name: Auto-add issues and PRs to org project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  add-to-project:
    name: Add to Panel de Sheily-AI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/Sheily-AI/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
