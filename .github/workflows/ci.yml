name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    # This repository is public. GitHub blocks org self-hosted runner groups
    # from public repositories by default; standard hosted runners are free
    # for public repositories and isolate untrusted pull-request code.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Parse workflow files
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          files = sorted(pathlib.Path(".github/workflows").glob("*.yml"))
          if not files:
              sys.exit("no workflow files")
          for path in files:
              loaded = yaml.safe_load(path.read_text())
              if not isinstance(loaded, dict) or "jobs" not in loaded:
                  sys.exit(f"{path} has no jobs")
              print(path)
          PY
  profile-generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test profile generator
        run: python3 -m unittest discover -s tests -v
