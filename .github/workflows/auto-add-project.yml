name: Auto-add issues and pull requests to organization project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-auto-add-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  add-to-project:
    if: github.event_name != 'workflow_dispatch'
    # Public repository control-plane workflow: use an isolated standard
    # GitHub-hosted runner. Standard hosted runners are free for public repos.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Add item to Sheily-AI project
        uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e
        with:
          project-url: https://github.com/orgs/Sheily-AI/projects/1
          github-token: ${{ secrets.SHEILY_PROJECT_TOKEN }}
