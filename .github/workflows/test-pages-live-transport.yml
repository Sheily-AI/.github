name: Verify SHEILY Pages live transport
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - assets/pages-live-transport.js
      - tests/**
      - .github/workflows/test-pages-live-transport.yml
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check assets/pages-live-transport.js
      - run: node --test tests/pages-live-transport.test.cjs
      - run: node --test tests/pages-generated-bundle.test.cjs
